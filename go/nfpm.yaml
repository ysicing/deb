name: golang
version: 1.25.5
arch: {{ .Arch }}
platform: linux
section: devel
priority: optional
maintainer: "ysicing <ysicing@12306.work>"
description: "Go programming language (prebuilt binary) installed to /usr/local/go with update-alternatives entries."
license: AGPLv3

package:
  name_template: "{{ .Package }}_{{ .Version }}_{{ .Arch }}.deb"

# 将本地目录 ./go 整个放到 /usr/local/go
contents:
  - src: ./go
    dst: /usr/local/go
    file_info:
      mode: 0755

# 包含 deb 脚本
scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh
  postremove: ./scripts/postremove.sh
