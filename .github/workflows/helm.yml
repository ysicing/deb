name: Build and Test Helm DEB Package

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'helm/**'
      - '.github/workflows/helm.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build DEB package
        run: |
          cd helm
          ./build.sh

      - name: List build artifacts
        run: |
          echo "Build artifacts:"
          find helm/build -name "*.deb" -exec ls -lh {} \;

      - name: Test DEB package installation (amd64 only)
        run: |
          sudo dpkg -i helm/build/amd64/*.deb || true
          sudo apt-get install -f -y

          echo "Verifying helm installation..."
          helm version
          which helm

      - name: Test DEB package removal
        run: |
          echo "Testing package removal..."
          sudo dpkg -r ys-helm

          if command -v helm &> /dev/null; then
            echo "helm should be removed but still exists"
            exit 1
          fi

          echo "Package removed successfully"

      - name: Publish to Fury
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          FURY_PUSH_TOKEN: ${{ secrets.FURY_PUSH_TOKEN }}
        run: |
          if [ -z "$FURY_PUSH_TOKEN" ]; then
            echo "FURY_PUSH_TOKEN not set, skipping publish"
            exit 0
          fi

          echo "Publishing DEB packages to Fury..."
          for deb in helm/build/*/*.deb; do
            if [ -f "$deb" ]; then
              echo "Uploading: $deb"
              curl -f -F package=@"$deb" "https://${FURY_PUSH_TOKEN}@push.fury.io/ysicing/"
              echo "Uploaded: $(basename "$deb")"
            fi
          done
          echo "All packages published to Fury!"
