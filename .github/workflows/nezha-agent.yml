name: Build and Test nezha-agent DEB Package

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'nezha-agent/**'
      - '.github/workflows/nezha-agent.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build DEB packages
        run: ./nezha-agent/build.sh

      - name: Test DEB package installation (amd64 only)
        run: |
          sudo apt-get install -y ./nezha-agent/build/amd64/ys-nezha-agent_*.deb
          test "$(command -v nezha-agent)" = /usr/local/bin/nezha-agent
          nezha-agent --help
          nezha-agent --version
          cp /usr/share/ys-nezha-agent/nezha-agent.service.example "$RUNNER_TEMP/ys-nezha-agent.service"
          sudo install -m 0600 /usr/share/ys-nezha-agent/agent.env.example /etc/default/ys-nezha-agent
          systemd-analyze verify "$RUNNER_TEMP/ys-nezha-agent.service"
          test ! -e /etc/systemd/system/ys-nezha-agent.service

      - name: Test DEB package removal
        run: |
          sudo dpkg -r ys-nezha-agent
          test ! -e /usr/local/bin/nezha-agent
          test ! -e /usr/share/ys-nezha-agent/nezha-agent.service.example
          test -f /etc/default/ys-nezha-agent

      - name: Publish to Fury
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          FURY_PUSH_TOKEN: ${{ secrets.FURY_PUSH_TOKEN }}
        run: |
          if [ -z "$FURY_PUSH_TOKEN" ]; then
            echo "FURY_PUSH_TOKEN not set, skipping publish"
            exit 0
          fi
          for deb in nezha-agent/build/*/*.deb; do
            curl -f -F package=@"$deb" "https://${FURY_PUSH_TOKEN}@push.fury.io/ysicing/"
          done
