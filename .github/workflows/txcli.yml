name: Build and Test txcli DEB Package

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'txcli/**'
      - '.github/workflows/txcli.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build DEB packages
        run: ./txcli/build.sh

      - name: Test DEB package installation (amd64 only)
        run: |
          sudo apt-get install -y ./txcli/build/amd64/ys-txcli_*.deb
          test "$(command -v txcli)" = /usr/local/bin/txcli
          txcli --help
          txcli policygen --read-only | python3 -m json.tool > /dev/null

      - name: Test DEB package removal
        run: |
          sudo dpkg -r ys-txcli
          test ! -e /usr/local/bin/txcli

      - name: Publish to Fury
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          FURY_PUSH_TOKEN: ${{ secrets.FURY_PUSH_TOKEN }}
        run: |
          if [ -z "$FURY_PUSH_TOKEN" ]; then
            echo "FURY_PUSH_TOKEN not set, skipping publish"
            exit 0
          fi
          for deb in txcli/build/*/*.deb; do
            curl -f -F package=@"$deb" "https://${FURY_PUSH_TOKEN}@push.fury.io/ysicing/"
          done
