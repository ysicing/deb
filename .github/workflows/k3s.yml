name: Build and Test K3s DEB Packages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'k3s/**'
      - '.github/workflows/k3s.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test lifecycle scripts
        run: python3 -m unittest discover -s k3s/tests -v

      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build both roles and architectures
        run: ./k3s/build.sh

      - name: Test installation, conflicts and removal
        run: |
          set -euo pipefail
          master=(k3s/build/amd64/ys-k3s-master_*.deb)
          worker=(k3s/build/amd64/ys-k3s-worker_*.deb)
          sudo dpkg -i "${master[0]}"
          /usr/local/bin/k3s --version
          test -f /etc/systemd/system/k3s.service
          if systemctl is-active --quiet k3s; then
            echo "Installation must not start k3s"
            exit 1
          fi
          if sudo dpkg -i "${worker[0]}"; then
            echo "Master and worker must conflict"
            exit 1
          fi
          sudo dpkg -r ys-k3s-master
          test ! -e /etc/systemd/system/k3s.service
          sudo dpkg -i "${worker[0]}"
          test -f /etc/systemd/system/k3s-agent.service
          sudo dpkg -r ys-k3s-worker
          test ! -e /etc/systemd/system/k3s-agent.service

      - name: Test adoption and repeated installation
        run: |
          set -euo pipefail
          master=(k3s/build/amd64/ys-k3s-master_*.deb)
          sudo mkdir -p /opt/existing-k3s /etc/rancher/k3s
          printf 'old binary\n' | sudo tee /opt/existing-k3s/k3s >/dev/null
          printf '[Service]\nExecStart=/opt/existing-k3s/k3s agent\n' | sudo tee /etc/systemd/system/k3s-agent.service >/dev/null
          printf 'token: preserve-me\n' | sudo tee /etc/rancher/k3s/config.yaml >/dev/null
          sha256sum /etc/systemd/system/k3s-agent.service /etc/rancher/k3s/config.yaml > /tmp/k3s-before.sha256
          sudo systemctl daemon-reload
          sudo dpkg -i "${master[0]}"
          sudo dpkg -i "${master[0]}"
          sha256sum -c /tmp/k3s-before.sha256
          cmp /usr/local/bin/k3s /opt/existing-k3s/k3s
          test ! -e /etc/systemd/system/k3s.service
          sudo dpkg -r ys-k3s-master
          sha256sum -c /tmp/k3s-before.sha256

      - name: Publish to Fury
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          FURY_PUSH_TOKEN: ${{ secrets.FURY_PUSH_TOKEN }}
        run: |
          if [ -z "$FURY_PUSH_TOKEN" ]; then
            echo "FURY_PUSH_TOKEN not set, skipping publish"
            exit 0
          fi
          for deb in k3s/build/*/*.deb; do
            curl -f -F package=@"$deb" "https://${FURY_PUSH_TOKEN}@push.fury.io/ysicing/"
          done
